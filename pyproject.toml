[project]
name = "adaptive-drive-to-sheet-adk"
version = "0.1.0"
description = "ADK wrapper for the adaptive Drive-to-Sheet Node pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk>=1.15.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=1.15.0,<2.0.0",
]
dev = [
    "pytest>=9.0.2,<10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = "."
